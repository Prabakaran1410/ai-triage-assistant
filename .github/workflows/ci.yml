name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      APP_DATABASE_URL: postgresql+asyncpg://triage_app:ci-only-password@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Apply migrations (admin role)
        run: python scripts/migrate.py
      - name: Set triage_app password
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "alter role triage_app with password 'ci-only-password';"
      - name: Test (including live tenant isolation against ephemeral Postgres)
        run: pytest -q
